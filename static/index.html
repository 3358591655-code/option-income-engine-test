<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/static/manifest.json">
<title>Option Income Engine</title>
<style>
:root{--bg:#070b14;--card:#101727;--line:#202a3e;--text:#edf2ff;--muted:#8e9bb3;--accent:#79a7ff;--good:#67d89b;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 16px 10px;position:sticky;top:0;background:rgba(7,11,20,.94);backdrop-filter:blur(12px);z-index:2}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}
main{padding:10px 12px 40px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label{color:var(--muted);font-size:11px;display:block;margin-bottom:5px}input,select,button{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1120;color:var(--text);padding:11px;font-size:14px}
button{background:#315fae;border:0;font-weight:700;margin-top:9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:var(--muted);font-size:11px}
.status{display:flex;align-items:center;justify-content:space-between}.state{font-size:26px;font-weight:800}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px}td{font-size:12px}
.csp{color:#67d89b}.cc{color:#79a7ff}.wait{color:#ffd166}.error{color:#ff7b8a}.tiny{font-size:11px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<header><h1>Option Income Engine</h1><div class="sub">CSP · Covered Call · Objective Scanner</div></header>
<main>
<section class="card">
<div class="row">
<div><label>标的</label><input id="symbol" value="QQQ" autocomplete="off"></div>
<div><label>策略</label><select id="type"><option value="">CSP + CC</option><option value="put">CSP</option><option value="call">Covered Call</option></select></div>
</div>
<div class="row3" style="margin-top:9px">
<div><label>DTE 最小</label><input id="dmin" type="number" value="25"></div>
<div><label>DTE 最大</label><input id="dmax" type="number" value="50"></div>
<div><label>Delta 上限</label><input id="dmaxx" type="number" step=".01" value=".25"></div>
</div>
<button onclick="runScan()">扫描期权链</button>
</section>

<section class="card">
<div class="status"><div><div class="muted">当前数据状态</div><div id="state" class="state wait">WAIT</div></div><div id="statusText" class="tiny">等待扫描</div></div>
</section>

<section class="card">
<div class="chips">
<span class="chip">Delta 0.15–0.25</span><span class="chip">DTE 25–50</span><span class="chip">OI ≥ 100</span><span class="chip">Volume ≥ 10</span><span class="chip">Spread ≤ 20%</span>
</div>
<div id="msg" class="tiny" style="margin-top:10px">输入标的后点击扫描。</div>
</section>

<section class="card">
<div class="tablewrap"><table><thead><tr>
<th>策略</th><th>Strike</th><th>DTE</th><th>Delta</th><th>IV</th><th>Bid</th><th>Ask</th><th>权利金</th><th>收益率</th><th>OI</th><th>Vol</th><th>历史</th>
</tr></thead><tbody id="tbody"></tbody></table></div>
</section>

<section class="card tiny">
<b>回测说明</b><br>
当前版本会严格区分“历史合约价格路径统计”和“严格策略回测”。没有历史链快照时，不会把今天的 Delta/OI/IV 倒灌到过去伪造 CSP/CC 胜率。后续接入历史链数据后，再开启严格回测。
</section>
</main>
<script>
async function runScan(){
 const s=document.getElementById('symbol').value.trim().toUpperCase();
 if(!s)return;
 const p=new URLSearchParams({
   contract_type:document.getElementById('type').value,
   dte_min:document.getElementById('dmin').value,
   dte_max:document.getElementById('dmax').value,
   delta_min:.15,
   delta_max:document.getElementById('dmaxx').value,
   min_oi:100,min_volume:10
 });
 document.getElementById('msg').textContent='正在读取 '+s+' 期权链…';
 try{
  const [a,b]=await Promise.all([
    fetch('/api/chain/'+encodeURIComponent(s)+'?'+p).then(r=>r.json()),
    fetch('/api/status/'+encodeURIComponent(s)).then(r=>r.json())
  ]);
  if(a.detail)throw new Error(a.detail);
  document.getElementById('state').textContent=b.state||'WAIT';
  document.getElementById('state').className='state '+(b.state==='CSP'?'csp':b.state==='CC'?'cc':'wait');
  document.getElementById('statusText').textContent=`CSP ${b.csp_count||0} 个 · CC ${b.cc_count||0} 个`;
  const tb=document.getElementById('tbody');tb.innerHTML='';
  for(const x of (a.results||[])){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="${x.strategy==='CSP'?'csp':'cc'}"><b>${x.strategy}</b></td>
    <td>${x.strike}</td><td>${x.dte}</td><td>${x.delta}</td><td>${x.iv??'-'}%</td>
    <td>${x.bid}</td><td>${x.ask}</td><td>${x.premium}</td><td>${x.premium_yield}%</td>
    <td>${x.open_interest}</td><td>${x.volume}</td>
    <td><button style="margin:0;padding:7px 9px" onclick="bt('${encodeURIComponent(x.contract)}')">查看</button></td>`;
    tb.appendChild(tr);
  }
  document.getElementById('msg').textContent=`找到 ${a.count} 个满足条件的候选。点击“查看”可读取该合约的历史价格路径统计。`;
 }catch(e){document.getElementById('msg').innerHTML='<span class="error">'+e.message+'</span>'}
}
async function bt(c){
 try{
  const r=await fetch('/api/backtest/'+c).then(x=>x.json());
  alert(JSON.stringify(r,null,2));
 }catch(e){alert(e.message)}
}
</script>
</body>
</html>
